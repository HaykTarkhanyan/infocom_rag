# Evaluation question set.
#
# HAND-MAINTAINED. eval/curate.py bootstrapped the generated cases once;
# do not re-run it, it would discard the hand-written ones.
#
# Ground truth is `expected_post_ids` (stable) rather than chunk ids
# (which change whenever chunking parameters change).
#
# holdout = true marks cases that must NEVER be tuned against. Report them
# separately; if held-out accuracy drifts below the tuned set, the tuning
# has started fitting the eval rather than improving the system.
#
# priority: 5 = must pass, 1 = nice to have. Used to run a subset when short
# on time or budget.
#
# type:
#   factual          answerable from one article
#   multi_source     needs more than one article. NOTE: recall@k counts these as
#                    a hit if ANY expected article is found; the report prints
#                    per-question coverage, which is the number to read.
#   unanswerable     NOT in the corpus -- the system must decline, not invent.
#                    expected_post_ids is empty and answer_must_contain is a
#                    refusal marker.
#   partial_coverage the corpus answers a NEARBY question but not the one asked
#                    (usually a different date). Correct behaviour is to give
#                    what IS covered, labelled with its real scope, and decline
#                    the rest. expected_post_ids still points at the article
#                    that should be retrieved.
#
# answer_must_contain is a LITERAL substring check. Armenian is agglutinative, so
# an inflected form of the right word fails it -- keep these to stems, numbers
# and names that will not decline, and read every failure before trusting it.

