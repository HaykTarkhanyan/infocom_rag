THE EVAL'S OWN BLIND SPOT. It scored 100% recall@10 for dense AND bm25 -- it had
stopped measuring retrieval. The cause was not corpus size. Bucketing 32 hard
candidates by question/source lexical overlap:

    overlap < 0.40   dense 7/8    bm25 5/8
    overlap 0.40-55  dense 9/11   bm25 9/11
    overlap > 0.55   dense 11/13  bm25 13/13

High overlap is a word-matching problem BM25 wins outright; low overlap has no
words to match and dense wins. Our set sits at median 0.46 -- dead in the
crossover. It was not merely too easy, it was concentrated in the one band where
the retriever choice cannot show up. That is also the first real evidence FOR
hybrid retrieval: the two win different questions, not the same ones by different
margins. (n is small; the direction matches theory, it is not significant.)

Second-order: the mechanical screen that rejects deictics, bad must_contain and
high overlap cut retriever disagreement from 6/24 in the raw batch to 1/9 among
survivors. It threw out the interesting questions with the broken ones. Hard
questions and defective questions look identical from outside.

QUERY REWRITING. The user asked whether the bot had memory. It did not, and the
demonstration mattered more than the answer:

    turn 1  "how many criminal cases from the 44-day war?"  -> 2044   correct
    turn 2  "and how many OF THOSE went to court?"          -> 118    WRONG (310)

"դրանցից" had no referent, so retrieval landed on a different article about
military desertion. Not a refusal -- a fluent, correctly-cited answer to a
question nobody asked. Fixed BEFORE retrieval, which is where the wrong document
gets chosen; feeding history to the generator alone would have fixed the wording
while still fetching the wrong article.

The design choice worth defending: a rewrite failure returns 502 rather than
falling back to the raw question. A fallback looks obviously right and would
silently reintroduce the exact bug, on the branch nobody ever exercises --
the same shape as the NameError that survived in the judge cache because every
run used --no-judge. Graceful degradation into a known-wrong state is not
graceful. And the substitution is PRINTED in the Retrieval step: the original bug
was invisible, so a fix that silently swaps your question would just be quieter.

The regression check mattered more than the fix. Two unrelated, already-standalone
questions asked with war history in the buffer both passed through unchanged.

