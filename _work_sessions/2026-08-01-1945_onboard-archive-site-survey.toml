notes = """
Decisions locked this session (user's call): news-only project (Telegram path dropped),
index a 2-5k article subset first, and start the code over from scratch rather than
refactoring the prototype.

Biggest survey findings, in the order they change the design:

1. The corpus to index is `indepth` (category 51): 5,836 articles, median 1,016 words,
   real bylines. The 146,936 `news` posts are 72-word wire stubs authored by a generic
   `adminfo_com` account — indexing them would swamp retrieval with near-duplicates.
2. The site runs PublishPress Authors. Real bylines are in `authors`/`ppma_author`, NOT
   the `author` field the old scraper read. That's why the old scrape's authors were
   useless.
3. `content.rendered` is stuffed with Elementor page-builder markup (301 elementor-element
   classes, 526 spans, SVG icons in a 10-article sample). The old regex tag-strip is not
   adequate — needs a real HTML parser with class-based removal.
4. Article URL slug != post ID. Post 1174257 lives at /10045113/.
5. `infotag` is a 1,074-term hand-curated entity taxonomy (people, countries, institutions).
   Strong candidate for a retrieval filter — nothing like it existed in the old design.
6. Indepth articles have real <h2> section structure, so heading-aware chunking beats
   fixed-size windows.
7. Data quality gotchas: 17 posts dated 2000-01-01 (placeholder), duplicate slugs
   (/19427/ and /19427-2/), `excerpt` is just a truncated body prefix not a summary,
   `reels` category is 30/30 empty (video only), `acf` is empty.
8. robots.txt lists AI-crawler blocks (GPTBot, ClaudeBot, CCBot) but they are ALL
   commented out — scraping is not disallowed. Still keep concurrency low.
9. Scale relief: indepth is ~16M tokens / ~35-40k chunks, versus 204,581 posts for the
   full archive. CPU-only embedding is plausible here where it wasn't before.

Windows gotcha hit repeatedly: python printing Armenian text dies with cp1252
UnicodeEncodeError. Fix is PYTHONIOENCODING=utf-8 on the command, and explicit
encoding='utf-8' on every FileHandler and open().
"""
