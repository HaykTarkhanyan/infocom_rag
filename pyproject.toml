[project]
name = "infocom-rag"
version = "0.1.0"
description = "RAG over infocom.am Armenian long-form journalism"
requires-python = "==3.12.*"

# Versions are pinned exactly to what is installed and verified working
# (`uv pip list`), so a fresh `uv sync` reproduces this environment.
dependencies = [
    "requests==2.34.2",
    "selectolax==0.4.11",
    "python-dotenv==1.2.2",
    "huggingface-hub==1.26.0",
    "transformers==5.14.1",
    "psycopg[binary]==3.3.4",
    "chainlit==2.11.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "asyncpg==0.31.0",
    "sqlalchemy==2.0.51",
    "rank-bm25==0.2.2",
    "httpx==0.28.1",
    "torch==2.13.0",
    "numpy==2.5.1",
]

[dependency-groups]
# Only needed by research/compare_extractors.py, which benchmarks trafilatura
# against selectolax. Not needed to run the pipeline.
research = [
    "trafilatura==2.2.0",
]

dev = [
    "pytest==9.1.1",
]

[tool.uv]
default-groups = ["research", "dev"]
