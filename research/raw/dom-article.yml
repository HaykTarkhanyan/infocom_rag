      - heading "ԱԺ «Ուժեղ Հայաստան» խմբակցության ղեկավար է ընտրվել Նարեկ Կարապետյանը" [level=1] [ref=f5e71]
    - generic [ref=f5e73]:
      - generic [ref=f5e75]:
        - paragraph [ref=f5e76]: "Ազգային ժողովի «Ուժեղ Հայաստան» խմբակցության ղեկավար է ընտրվել Նարեկ Կարապետյանը, խմբակցության քարտուղար՝ Տիգրան Աբրահամյանը: Այս մասին հաղորդում է ընդդիմադիր դաշինքը իր ֆեյսբուքյան էջում:"
        - paragraph [ref=f5e77]: "Այդ ընտրություններով ձևավորված 9-րդ գումարման Ազգային ժողովն աշխատանքները սկսում է վաղը:"
        - paragraph [ref=f5e78]: «Ուժեղ Հայաստան» դաշինքը ընտրությունների արդյունքում ստացել է 29 մանդատ։
        - paragraph [ref=f5e79]: Ավելի վաղ՝ դաշինքը հրապարակել էր պատգամավորների ցուցակը, որում հայտնվել էին՝ Նարեկ Կարապետյանը, Արամ Վարդևանյանը,Դավիթ Ղազինյանը, Ռուբեն Մխիթարյանը, Արեգա Հովսեփյանը, Մամիկոն Ասլանյանը, Մարիաննա Ղահրամանյանը, Հայկ Սուքիասյանը, Արգիշտի Դարբինյանը, Իրինա Յոլյանը, Էդգար Ղազարյանը, Տիգրան Աբրահամյանը, Լենա Մաթևոսյանը, Անդրանիկ Գևորգյանը, Հայկ Ֆարմանյանը, Գրիշա Թամրազյանը, Լիանա Գասպարյանը, Վաղինակ Վարդանովը, Գառնիկ Դավթյանը, Լիանա Մանուկյանը, Հարություն Մնացականյանը, Վրույր Այվազյանը, Սյուզաննա Ավետիսյանը, Հարություն Հարությունյանը, Շիրազ Մանուկյանը Անուշ Միրզոյանը, Անուշավան Մանուչարյանը, Հասմիկ Ենգորյանը և Արման Ավչյանը։
